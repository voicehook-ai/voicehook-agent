[build-system]
requires = ["hatchling>=1.27"]  # PEP 639: SPDX license + license-files
build-backend = "hatchling.build"

[project]
name = "voicehook-agent"
version = "0.14.0"
description = "Zero-install CLI for any LLM agent to join a voicehook.ai voice call as a 2nd participant"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "voicehook.ai" }]
keywords = ["voicehook", "livekit", "agent", "voice", "llm", "claude-code", "voicebot", "speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Topic :: Communications :: Conferencing",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "livekit>=0.18.0",
  "httpx>=0.27.0",
]

[project.scripts]
voicehook-agent = "voicehook_agent.cli:main"
voicehook-agent-hook = "voicehook_agent.activity:console_main"

[project.urls]
Homepage = "https://voicehook.ai"
Repository = "https://github.com/voicehook-ai/voicehook-agent"
Issues = "https://github.com/voicehook-ai/voicehook-agent/issues"
Documentation = "https://voicehook.ai/agent/SKILL.md"

[tool.hatch.build.targets.sdist]
# Nur was zum Bauen/Installieren noetig ist; tests/, assets/, plugins/, scripts/ bleiben im Repo.
only-include = ["src/voicehook_agent", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/voicehook_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/voicehook_agent/strict-relay.txt" = "voicehook_agent/strict-relay.txt"

[project.optional-dependencies]
test = ["pytest>=7.0"]
