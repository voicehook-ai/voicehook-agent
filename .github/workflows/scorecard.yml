name: Scorecard

on:
  push:
    branches: [master]
  schedule:
    # Wöchentlich, Montag 05:17 UTC
    - cron: "17 5 * * 1"
  branch_protection_rule:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard-Analyse
    # Scorecard bewertet nur den Default-Branch.
    if: github.event.repository.default_branch == github.ref_name
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # SARIF in den Security-Tab hochladen
      security-events: write
      # Checkout und Lesezugriff auf Workflow-Läufe für die Checks
      contents: read
      actions: read
      # Erst nötig mit publish_results: true (OIDC-Nachweis für scorecard.dev):
      # id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # false: Ergebnis nur im Security-Tab dieses Repos, keine
          # Veröffentlichung auf scorecard.dev, kein Badge.
          publish_results: false

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
