name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Grenzen aus pyproject: requires-python >=3.10, Classifier bis 3.13
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (wie lokal, editable + test-Extra)
        run: python -m pip install -e '.[test]'
      - name: pytest (Projekt-Suite)
        run: python -m pytest tests -q
      - name: pytest (CI-/Release-Skripte)
        run: python -m pytest scripts/tests -q

  ruff:
    name: ruff (neue Befunde brechen)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Version gepinnt: ruff-Defaults aendern sich zwischen Versionen, die Baseline gilt fuer diese.
      - run: python -m pip install ruff==0.16.10
      - name: ruff gegen Altbestand-Baseline (scripts/ruff-baseline.json)
        run: python scripts/ruff_baseline.py

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISABLE_AUTOUPDATER: "1"
      # Kein Login/API-Key: validate laeuft rein lokal gegen die Manifeste.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Claude Code CLI (npm, gepinnt)
        run: npm install -g @anthropic-ai/claude-code@2.1.295 && claude --version
      - name: validate --strict plugins/voicehook-join
        run: claude plugin validate --strict plugins/voicehook-join
      - name: validate --strict . (Marketplace)
        run: claude plugin validate --strict .

  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gitleaks/gitleaks-action verlangt fuer Organisations-Repos ein GITLEAKS_LICENSE-Secret;
      # daher das offizielle Release-Binary, Version + SHA256 gepinnt.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ganze Historie scannen, nicht nur den Merge-Commit
          persist-credentials: false
      - name: gitleaks installieren (Checksumme geprueft)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks git (Allowlist .gitleaks.toml)
        run: $RUNNER_TEMP/gitleaks git --config .gitleaks.toml --redact --no-banner -v .

  skill-drift:
    # Eigener Job und bewusst kein Required Check: Drift ist zeitweise legitim
    # (voicehook-v4 deployt vor dem Plugin-Sync).
    name: skill-drift (voicehook.ai/agent/mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: SKILL.md byte-gleich mit https://voicehook.ai/agent/mcp/
        run: python scripts/check_skill_drift.py
